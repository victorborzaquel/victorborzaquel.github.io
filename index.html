<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevTools</title>
  <style>
    :root {
      --bg: #0f0f11;
      --surface: #18181b;
      --surface-2: #232329;
      --border: #2e2e35;
      --text: #e4e4e7;
      --text-muted: #71717a;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --accent-dim: #6366f120;
      --green: #22c55e;
      --green-dim: #22c55e18;
      --red: #f87171;
      --radius: 10px;
      --radius-sm: 6px;
      --font: "Inter", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────────────── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 100;
    }

    .logo {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    .logo span { color: var(--accent); }

    nav {
      display: flex;
      gap: 4px;
      margin-left: 20px;
    }

    .nav-link {
      padding: 5px 12px;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.15s, color 0.15s;
      cursor: pointer;
      border: none;
      background: none;
    }

    .nav-link:hover { background: var(--surface-2); color: var(--text); }
    .nav-link.active { background: var(--accent-dim); color: var(--accent-hover); }

    /* ── Layout ──────────────────────────────────────────── */
    main { max-width: 900px; margin: 0 auto; padding: 32px 24px 64px; }

    .page { display: none; }
    .page.active { display: block; }

    .page-header {
      margin-bottom: 28px;
    }

    .page-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.4px;
      margin-bottom: 4px;
    }

    .page-desc { color: var(--text-muted); font-size: 13px; }

    /* ── Tabs ────────────────────────────────────────────── */
    .tabs {
      display: flex;
      gap: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 4px;
      width: fit-content;
      margin-bottom: 28px;
    }

    .tab-btn {
      padding: 6px 16px;
      border-radius: var(--radius-sm);
      border: none;
      background: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { background: var(--surface-2); color: var(--text); box-shadow: 0 1px 2px #0005; }

    .tab-flag { font-size: 15px; }

    /* ── Card ────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    /* ── Fields grid ─────────────────────────────────────── */
    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }

    @media (max-width: 600px) { .fields { grid-template-columns: 1fr; } }

    .field {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: background 0.1s;
    }

    .field:hover { background: var(--surface-2); }

    .field:nth-child(even) { border-right: none; }
    .field:nth-last-child(-n+2) { border-bottom: none; }
    .field:nth-last-child(1):nth-child(odd) { border-right: none; border-bottom: none; grid-column: span 2; }

    .field-left { min-width: 0; flex: 1; }

    .field-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    .field-value {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      font-family: "SF Mono", "Fira Code", monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .copy-btn {
      flex-shrink: 0;
      width: 30px;
      height: 30px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      font-size: 12px;
    }

    .copy-btn:hover { background: var(--surface-2); color: var(--text); border-color: var(--text-muted); }
    .copy-btn.copied { background: var(--green-dim); border-color: var(--green); color: var(--green); }

    /* ── Actions ─────────────────────────────────────────── */
    .actions { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }

    .btn {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 18px;
      border-radius: var(--radius-sm);
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:active { transform: scale(0.98); }

    .btn-ghost {
      background: none;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover { background: var(--surface-2); color: var(--text); }

    /* ── Bank section ────────────────────────────────────── */
    .bank-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 20px;
      background: #635bff18;
      color: #8b83ff;
      border: 1px solid #635bff40;
    }

    .section-gap { margin-top: 20px; }

    /* ── Bank select ─────────────────────────────────────── */
    .bank-select {
      appearance: none;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 12px;
      font-family: var(--font);
      padding: 5px 28px 5px 10px;
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s;
      background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%2371717a' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 9px center;
    }

    .bank-select:hover, .bank-select:focus { border-color: var(--accent); }
    .bank-select option { background: var(--surface-2); color: var(--text); }

    /* ── Tooltip flash ───────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      white-space: nowrap;
      z-index: 999;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

<header>
  <div class="logo">dev<span>tools</span></div>
  <nav>
    <button class="nav-link active" onclick="showPage('faker')">Person Faker</button>
  </nav>
</header>

<main>
  <!-- ── Person Faker ───────────────────────────── -->
  <div class="page active" id="page-faker">
    <div class="page-header">
      <div class="page-title">Person Faker</div>
      <div class="page-desc">Gera dados fictícios de pessoas para uso em testes e desenvolvimento.</div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchLocale('br', this)">
        <span class="tab-flag">🇧🇷</span> Brasil
      </button>
      <button class="tab-btn" onclick="switchLocale('us', this)">
        <span class="tab-flag">🇺🇸</span> United States
      </button>
    </div>

    <div class="actions">
      <button class="btn btn-primary" onclick="generate()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
        Gerar
      </button>
      <button class="btn btn-ghost" onclick="copyAll()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copiar tudo
      </button>
    </div>

    <!-- Dados pessoais -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Dados Pessoais</span>
      </div>
      <div class="fields" id="personal-fields"></div>
    </div>

    <!-- Dados bancários -->
    <div class="card section-gap">
      <div class="card-header">
        <span class="card-title">Dados Bancários</span>
        <div style="display:flex;align-items:center;gap:8px;">
          <select class="bank-select" id="bank-scenario" onchange="renderBankFromSelect()"></select>
          <span class="bank-badge">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M20.47 2H3.53a1.45 1.45 0 0 0-1.45 1.45v16.1a1.45 1.45 0 0 0 1.45 1.45h16.94a1.45 1.45 0 0 0 1.45-1.45V3.45A1.45 1.45 0 0 0 20.47 2zm-4.5 3.5h2.5v2.5h-2.5zm-4 0h2.5v2.5h-2.5zm-4 0H10v2.5H7.97zm10.53 12H5.5v-7h13zm0-9.5H15.5v-2.5h3v2.5z"/></svg>
            Stripe Test Data
          </span>
        </div>
      </div>
      <div class="fields" id="bank-fields"></div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
// ── State ─────────────────────────────────────────────────
let locale = 'br';
let currentData = {};

// ── Data ──────────────────────────────────────────────────
const data = {
  br: {
    firstNamesMale: ['Miguel','Arthur','Heitor','Bernardo','Davi','Lucas','Gabriel','Pedro','Matheus','Rafael','Felipe','Gustavo','Henrique','Rodrigo','Thiago','Leonardo','Bruno','André','Carlos','Marcos','Vinicius','Eduardo','Fernando','Alexandre','Caio','Igor','Leandro','Otávio','Renato','Sérgio'],
    firstNamesFemale: ['Alice','Sophia','Valentina','Helena','Laura','Isabela','Manuela','Júlia','Heloísa','Luísa','Ana','Beatriz','Clara','Daniela','Fernanda','Gabriela','Letícia','Maria','Natália','Patrícia','Amanda','Bruna','Camila','Diana','Eduarda','Larissa','Mariana','Nicole','Rafaela','Vitória'],
    lastNames: ['Silva','Santos','Oliveira','Souza','Rodrigues','Ferreira','Alves','Pereira','Lima','Gomes','Costa','Ribeiro','Martins','Carvalho','Almeida','Lopes','Sousa','Fernandes','Vieira','Barbosa','Rocha','Dias','Nascimento','Andrade','Moreira','Neves','Medeiros','Castro','Araújo','Cardoso'],
    emailDomains: ['gmail.com','hotmail.com','outlook.com','yahoo.com.br','uol.com.br','bol.com.br'],
    ddds: ['11','12','13','14','15','16','17','18','19','21','22','24','27','28','31','32','33','34','35','37','38','41','42','43','44','45','46','47','48','49','51','53','54','55','61','62','63','64','65','66','67','68','69','71','73','74','75','77','79','81','82','83','84','85','86','87','88','89','91','92','93','94','95','96','97','98','99'],
  },
  us: {
    firstNamesMale: ['James','John','Robert','Michael','William','David','Richard','Joseph','Thomas','Charles','Christopher','Daniel','Matthew','Anthony','Mark','Donald','Steven','Paul','Andrew','Joshua','Kevin','Brian','George','Timothy','Ronald','Edward','Jason','Jeffrey','Ryan','Jacob'],
    firstNamesFemale: ['Mary','Patricia','Jennifer','Linda','Barbara','Elizabeth','Susan','Jessica','Sarah','Karen','Lisa','Nancy','Betty','Margaret','Sandra','Ashley','Dorothy','Kimberly','Emily','Donna','Michelle','Carol','Amanda','Melissa','Deborah','Stephanie','Rebecca','Sharon','Laura','Cynthia'],
    lastNames: ['Smith','Johnson','Williams','Brown','Jones','Garcia','Miller','Davis','Rodriguez','Martinez','Hernandez','Lopez','Gonzalez','Wilson','Anderson','Thomas','Taylor','Moore','Jackson','Martin','Lee','Perez','Thompson','White','Harris','Sanchez','Clark','Ramirez','Lewis','Robinson'],
    emailDomains: ['gmail.com','yahoo.com','outlook.com','hotmail.com','icloud.com','protonmail.com'],
    states: ['AL','AK','AZ','AR','CA','CO','CT','DE','FL','GA','HI','ID','IL','IN','IA','KS','KY','LA','ME','MD','MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ','NM','NY','NC','ND','OH','OK','OR','PA','RI','SC','SD','TN','TX','UT','VT','VA','WA','WV','WI','WY'],
  },
};

// ── Helpers ───────────────────────────────────────────────
const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const pick = arr => arr[rand(0, arr.length - 1)];
const rpad = (n, len) => String(n).padStart(len, '0');
const randDigits = n => Array.from({ length: n }, () => rand(0, 9));

// ── CPF ───────────────────────────────────────────────────
function genCPF(formatted = true) {
  const d = randDigits(9);
  const c1 = cpfDigit(d, 10);
  const c2 = cpfDigit([...d, c1], 11);
  const raw = [...d, c1, c2];
  if (!formatted) return raw.join('');
  return `${raw.slice(0,3).join('')}.${raw.slice(3,6).join('')}.${raw.slice(6,9).join('')}-${raw.slice(9).join('')}`;
}

function cpfDigit(digits, weight) {
  const sum = digits.reduce((acc, d, i) => acc + d * (weight - i), 0);
  const rem = sum % 11;
  return rem < 2 ? 0 : 11 - rem;
}

// ── CEP ───────────────────────────────────────────────────
function genCEP() {
  const n = rpad(rand(1000000, 99999999), 8);
  return `${n.slice(0,5)}-${n.slice(5)}`;
}

// ── Phone BR ──────────────────────────────────────────────
function genPhoneBR() {
  const ddd = pick(data.br.ddds);
  const num = `9${rpad(rand(0, 99999999), 8)}`;
  return `(${ddd}) ${num.slice(0,5)}-${num.slice(5)}`;
}

// ── SSN ───────────────────────────────────────────────────
function genSSN() {
  // Use 900-999 area (ITIN range) — clearly test data
  const area = rand(900, 999);
  const group = rpad(rand(1, 99), 2);
  const serial = rpad(rand(1, 9999), 4);
  return `${area}-${group}-${serial}`;
}

// ── ZIP ───────────────────────────────────────────────────
function genZIP() {
  return rpad(rand(10000, 99999), 5);
}

// ── Phone US ──────────────────────────────────────────────
function genPhoneUS() {
  const area = rand(200, 999);
  const exch = rand(200, 999);
  const sub  = rpad(rand(0, 9999), 4);
  return `(${area}) ${exch}-${sub}`;
}

// ── Email ─────────────────────────────────────────────────
function genEmail(first, last, loc) {
  const domains = data[loc].emailDomains;
  const sep = pick(['.', '_', '']);
  const variants = [
    `${first.toLowerCase()}${sep}${last.toLowerCase()}`,
    `${first.toLowerCase()}${rand(1, 99)}`,
    `${first.toLowerCase().slice(0,1)}${last.toLowerCase()}`,
    `${last.toLowerCase()}${sep}${first.toLowerCase()}`,
  ];
  const local = pick(variants)
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9._]/g, '');
  return `${local}@${pick(domains)}`;
}

// ── Stripe test bank accounts ─────────────────────────────
// https://docs.stripe.com/connect/testing
const stripeAccounts = {
  br: [
    { routing: '0001', account: '0001234', note: 'Success' },
    { routing: '0001', account: '1111116', note: 'No account' },
    { routing: '0001', account: '1111113', note: 'Account closed' },
    { routing: '0001', account: '2222227', note: 'Insufficient funds' },
    { routing: '0001', account: '3333335', note: 'Debit not authorized' },
    { routing: '0001', account: '4444440', note: 'Invalid currency' },
  ],
  us: [
    { routing: '110000000', account: '000123456789', type: 'checking', note: 'Success' },
    { routing: '110000000', account: '000333333335', type: 'savings',  note: 'Success (savings)' },
    { routing: '110000000', account: '000111111113', type: 'checking', note: 'Account closed' },
    { routing: '110000000', account: '000111111116', type: 'checking', note: 'No account' },
    { routing: '110000000', account: '000222222227', type: 'checking', note: 'Debit not authorized' },
  ],
};

function getSelectedBank() {
  const idx = parseInt(document.getElementById('bank-scenario').value ?? '0', 10);
  return { ...stripeAccounts[locale][idx] };
}

function updateBankSelect() {
  const sel = document.getElementById('bank-scenario');
  const accounts = stripeAccounts[locale];
  sel.innerHTML = accounts.map((a, i) =>
    `<option value="${i}">${a.note}</option>`
  ).join('');
}

// ── Generate ──────────────────────────────────────────────
function generate() {
  const loc = locale;
  const isFemale = Math.random() > 0.5;
  const firstNames = isFemale ? data[loc].firstNamesFemale : data[loc].firstNamesMale;
  const first = pick(firstNames);
  const last  = pick(data[loc].lastNames);
  const email = genEmail(first, last, loc);

  if (loc === 'br') {
    const cpf = genCPF();
    const cep = genCEP();
    const phone = genPhoneBR();

    currentData = {
      personal: [
        { label: 'Nome',         value: first },
        { label: 'Sobrenome',    value: last },
        { label: 'Nome completo',value: `${first} ${last}` },
        { label: 'Email',        value: email },
        { label: 'CPF',          value: cpf },
        { label: 'CEP',          value: cep },
        { label: 'Telefone',     value: phone },
      ],
    };
  } else {
    const ssn   = genSSN();
    const zip   = genZIP();
    const phone = genPhoneUS();

    currentData = {
      personal: [
        { label: 'First name', value: first },
        { label: 'Last name',  value: last },
        { label: 'Full name',  value: `${first} ${last}` },
        { label: 'Email',      value: email },
        { label: 'SSN',        value: ssn },
        { label: 'ZIP code',   value: zip },
        { label: 'Phone',      value: phone },
      ],
    };
  }

  renderBankFromSelect();
  renderFields('personal-fields', currentData.personal);
}

function renderBankFromSelect() {
  const bank = getSelectedBank();
  const fields = locale === 'br'
    ? [
        { label: 'Agência',        value: bank.routing },
        { label: 'Conta',          value: bank.account },
        { label: 'Stripe note',    value: bank.note },
      ]
    : [
        { label: 'Routing number', value: bank.routing },
        { label: 'Account number', value: bank.account },
        { label: 'Account type',   value: bank.type },
        { label: 'Stripe note',    value: bank.note },
      ];
  currentData.bank = fields;
  renderFields('bank-fields', fields);
}

// ── Render ────────────────────────────────────────────────
function renderFields(containerId, fields) {
  const el = document.getElementById(containerId);
  el.innerHTML = fields.map((f, i) => `
    <div class="field">
      <div class="field-left">
        <div class="field-label">${f.label}</div>
        <div class="field-value" id="val-${containerId}-${i}" title="${f.value}">${f.value}</div>
      </div>
      <button class="copy-btn" onclick="copyField('val-${containerId}-${i}', this)" title="Copiar">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </button>
    </div>
  `).join('');
}

// ── Copy ──────────────────────────────────────────────────
function copyField(valId, btn) {
  const text = document.getElementById(valId)?.textContent ?? '';
  navigator.clipboard.writeText(text).then(() => {
    btn.classList.add('copied');
    btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2v1"/></svg>`;
    }, 1500);
  });
}

function copyAll() {
  if (!currentData.personal) return;
  const all = [...(currentData.personal || []), ...(currentData.bank || [])];
  const text = all.map(f => `${f.label}: ${f.value}`).join('\n');
  navigator.clipboard.writeText(text).then(() => showToast('Todos os dados copiados!'));
}

// ── Toast ─────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ── Nav ───────────────────────────────────────────────────
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-link').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + id)?.classList.add('active');
  event.currentTarget.classList.add('active');
}

function switchLocale(loc, btn) {
  locale = loc;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  updateBankSelect();
  generate();
}

// ── Init ──────────────────────────────────────────────────
updateBankSelect();
generate();
</script>
</body>
</html>
