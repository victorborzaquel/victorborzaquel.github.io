<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevTools</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>

<header>
  <div class="logo">dev<span>tools</span></div>
  <nav>
    <button class="nav-link active" onclick="showPage('faker', this)">Person Faker</button>
  </nav>
</header>

<main>
  <!-- ── Person Faker ───────────────────────────────────── -->
  <div class="page active" id="page-faker">
    <div class="page-header">
      <div class="page-title">Person Faker</div>
      <div class="page-desc">Gera dados fictícios de pessoas para uso em testes e desenvolvimento.</div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchLocale('br', this)">
        <span class="tab-flag">🇧🇷</span> Brasil
      </button>
      <button class="tab-btn" onclick="switchLocale('us', this)">
        <span class="tab-flag">🇺🇸</span> United States
      </button>
    </div>

    <div class="actions">
      <button class="btn btn-primary" onclick="generate()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
        Gerar
      </button>
      <button class="btn btn-ghost" onclick="copyAll()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copiar tudo
      </button>
    </div>

    <!-- Dados pessoais -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Dados Pessoais</span>
      </div>
      <div class="fields" id="personal-fields"></div>
    </div>

    <!-- Dados bancários (Stripe test data) -->
    <div class="card section-gap">
      <div class="card-header">
        <span class="card-title">Dados Bancários</span>
        <div style="display:flex;align-items:center;gap:8px;">
          <select class="bank-select" id="bank-scenario" onchange="renderBankFromSelect()"></select>
          <span class="bank-badge">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M20.47 2H3.53a1.45 1.45 0 0 0-1.45 1.45v16.1a1.45 1.45 0 0 0 1.45 1.45h16.94a1.45 1.45 0 0 0 1.45-1.45V3.45A1.45 1.45 0 0 0 20.47 2zm-4.5 3.5h2.5v2.5h-2.5zm-4 0h2.5v2.5h-2.5zm-4 0H10v2.5H7.97zm10.53 12H5.5v-7h13zm0-9.5H15.5v-2.5h3v2.5z"/></svg>
            Stripe Test Data
          </span>
        </div>
      </div>
      <div class="fields" id="bank-fields"></div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
